function sortEntries(entries) {
  const arr = [...entries];
  switch(S.sortBy) {
    case 'date_desc': return arr.sort((a,b) => new Date(b.date) - new Date(a.date));
    case 'date_asc':  return arr.sort((a,b) => new Date(a.date) - new Date(b.date));
    case 'amt_desc':  return arr.sort((a,b) => b.amt - a.amt);
    case 'amt_asc':   return arr.sort((a,b) => a.amt - b.amt);
    default: return arr;
  }
}

function guessCat(cat, note, cats) {
  const t = ((cat||'')+' '+(note||'')).toLowerCase();
  for (const c of cats) { if ((c.k||[]).some(k=>t.includes(k))) return c.id; }
  return cats[cats.length-1]?.id || 'other';
}
function parseDate(s) {
  if (!s) return new Date(); s=s.trim();
  let m;
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(s); return isNaN(d)?new Date():d;
}
function detectBank(text){const fl=text.split('\n').find(l=>!l.startsWith('sep=')&&l.trim());return fl&&/^(Расход|Expense)/i.test(fl);}
function parseBankCSV(text, expCats){
  const lines=text.replace(/\r\n/g,'\n').split('\n').filter(l=>!l.startsWith('sep=')&&l.trim());
  const merged=[];
  for(const line of lines){if(/^(Расход|Expense)/i.test(line)||!merged.length)merged.push(line);else merged[merged.length-1]+=' '+line.trim();}
  const rows=[];
  for(const line of merged){
    const p=line.split(',');if(p.length<5)continue;
    const type=p[0].trim(),dt=p[1].trim(),cat=p[2].trim();
    const amt=parseFloat((p[p.length-2]||'').trim().replace(/\s/g,''));
    const desc=p.slice(3,p.length-2).join(',').trim();
    if(!/^(Расход|Expense)/i.test(type)||!amt||amt<=0)continue;
    const d=parseDate(dt);
    rows.push({cat:guessCat(cat,desc,expCats),amt,note:[cat,desc].filter(Boolean).join(' — ').slice(0,80),date:d.toISOString(),monthKey:`${d.getFullYear()}-${d.getMonth()}`});
  }
  return rows;
}
function parseCSV(text){
  const lines=text.replace(/\r\n/g,'\n').split('\n');
  const headers=lines[0].split(',').map(h=>h.trim());
  const rows=[];
  for(let i=1;i<lines.length;i++){if(!lines[i].trim())continue;const vals=lines[i].split(',');const obj={};headers.forEach((h,j)=>{obj[h]=(vals[j]||'').trim();});rows.push(obj);}
  return{headers,rows};
}

function walletBalance(id){
  let bal=0;
  Object.values(S.expenses).forEach(list=>list.forEach(e=>{if((e.walletId||'cash')===id)bal-=e.amt;}));
  Object.values(S.incomes).forEach(list=>list.forEach(e=>{if((e.walletId||'cash')===id)bal+=e.amt;}));
  S.transfers.forEach(t=>{
    if(t.from===id)bal-=t.amtFrom;
    if(t.to===id)bal+=t.amtTo;
  });
  return bal;
}
function mk(){return `${S.year}-${S.month}`;}
function expData(){return S.expenses[mk()]||[];}
function incData(){return S.incomes[mk()]||[];}
function expTotals(){const t={};for(const x of expData())t[x.cat]=(t[x.cat]||0)+x.amt;return t;}
function totalExp(){return Object.values(expTotals()).reduce((a,b)=>a+b,0);}
function totalInc(){return (S.incomes[mk()]||[]).reduce((s,x)=>s+x.amt,0);}
function balance(){return totalInc()-totalExp();}

async function loadAll(){
  try{
    const [eSnap,iSnap,cSnap,wSnap,tSnap]=await Promise.all([
      getDocs(collection(db,'expenses')),
      getDocs(collection(db,'incomes')),
      getDocs(collection(db,'categories')),
      getDocs(collection(db,'wallets')),
      getDocs(collection(db,'transfers')),
    ]);
    const expenses={},incomes={};
    eSnap.forEach(d=>{const x={...d.data(),fid:d.id};if(!expenses[x.monthKey])expenses[x.monthKey]=[];expenses[x.monthKey].push(x);});
    iSnap.forEach(d=>{const x={...d.data(),fid:d.id};if(!incomes[x.monthKey])incomes[x.monthKey]=[];incomes[x.monthKey].push(x);});

    // Load custom categories
    const expCats=[],incCats=[];
    cSnap.forEach(d=>{const x={...d.data(),fid:d.id};if(x.type==='expense')expCats.push(x);else incCats.push(x);});
    S.expenses=expenses; S.incomes=incomes;
    if(expCats.length>0) S.expCats=expCats.sort((a,b)=>(a.order||0)-(b.order||0));
    if(incCats.length>0) S.incCats=incCats.sort((a,b)=>(a.order||0)-(b.order||0));

    // Load wallets
    const wallets=[];
    wSnap.forEach(d=>wallets.push({...d.data(),fid:d.id}));
    if(wallets.length>0) S.wallets=wallets.sort((a,b)=>(a.order||0)-(b.order||0));

    // Load transfers
    const transfers=[];
    tSnap.forEach(d=>transfers.push({...d.data(),fid:d.id}));
    S.transfers=transfers.sort((a,b)=>new Date(b.date)-new Date(a.date));

    render();
  }catch(e){alert('Ошибка Firebase: '+e.message);}
}

// Categories CRUD
async function saveCategoryToFirebase(catData){
  setState({syncing:true});
  const data={...catData,k:catData.k||[]};
  if(catData.fid){
    await updateDoc(doc(db,'categories',catData.fid),data);
  } else {
    const ref=await addDoc(collection(db,'categories'),data);
    catData.fid=ref.id;
  }
  setState({syncing:false});
  return catData;
}

async function addCategory(){
  const nc=S.settings.newCat;
  if(!nc.n.trim()) return;
  const newCat={id:'cat_'+Date.now(),e:nc.e,n:nc.n.trim(),c:nc.c,type:nc.type,k:[],order:Date.now()};
  setState({syncing:true});
  const ref=await addDoc(collection(db,'categories'),newCat);
  newCat.fid=ref.id;
  if(nc.type==='expense') S.expCats=[...S.expCats,newCat];
  else S.incCats=[...S.incCats,newCat];
  setState({syncing:false,settings:{...S.settings,newCat:{e:'💼',n:'',c:'#4ade80',type:nc.type}}});
}

async function updateCategory(catData){
  setState({syncing:true});
  if(catData.fid){
    await updateDoc(doc(db,'categories',catData.fid),catData);
  } else {
    // Was a default cat - save to firebase
    const ref=await addDoc(collection(db,'categories'),catData);
    catData.fid=ref.id;
  }
  if(catData.type==='expense') S.expCats=S.expCats.map(c=>c.id===catData.id?catData:c);
  else S.incCats=S.incCats.map(c=>c.id===catData.id?catData:c);
  setState({syncing:false,settings:{...S.settings,editId:null,editCat:null}});
}

async function deleteCategory(cat){
  if (!confirm(`Удалить категорию "${cat.n}"?\n\nСтарые записи останутся с этой категорией (будет показано серым).`)) return;
  setState({syncing:true});
  // Save to ghostCats so old records can still display the name
  S.ghostCats = {...S.ghostCats, [cat.id]: {...cat, deleted:true}};
  // Remove from active list
  if (cat.fid) await deleteDoc(doc(db,'categories',cat.fid));
  if (cat.type==='expense') S.expCats = S.expCats.filter(c=>c.id!==cat.id);
  else S.incCats = S.incCats.filter(c=>c.id!==cat.id);
  setState({syncing:false});
}

// Initialize defaults to Firebase if empty
async function initDefaultCategories(){
  const snap=await getDocs(collection(db,'categories'));
  if(snap.empty){
    for(const c of DEFAULT_EXP){const ref=await addDoc(collection(db,'categories'),{...c,type:'expense',order:DEFAULT_EXP.indexOf(c)});c.fid=ref.id;}
    for(const c of DEFAULT_INC){const ref=await addDoc(collection(db,'categories'),{...c,type:'income',order:DEFAULT_INC.indexOf(c)});c.fid=ref.id;}
    S.expCats=[...DEFAULT_EXP];S.incCats=[...DEFAULT_INC];render();
  }
}

async function resetCategoriesToDefault(type) {
  const label = type === 'expense' ? 'расходов' : 'доходов';
  if (!confirm(`Сбросить категории ${label} к стандартным?\n\nСтарые категории будут удалены из Firebase и заменены стандартными.\nЗаписи останутся нетронутыми.`)) return;
  setState({syncing: true});

  // Delete existing categories of this type from Firebase
  const snap = await getDocs(collection(db, 'categories'));
  for (const d of snap.docs) {
    const data = d.data();
    if (data.type === type || (type === 'expense' && !data.type)) {
      await deleteDoc(doc(db, 'categories', d.id));
    }
  }

  // Re-create from defaults
  const defaults = type === 'expense' ? DEFAULT_EXP : DEFAULT_INC;
  const newCats = [];
  for (let i = 0; i < defaults.length; i++) {
    const cat = {...defaults[i], type, order: i};
    const ref = await addDoc(collection(db, 'categories'), cat);
    newCats.push({...cat, fid: ref.id});
  }

  if (type === 'expense') S.expCats = newCats;
  else S.incCats = newCats;

  setState({syncing: false});
  alert(`✅ Категории ${label} сброшены к стандартным!`);
}

function doAnalysis(){
  setState({loading:true,analysis:'',tab:'analysis'});
  setTimeout(()=>{
    const tot=expTotals(), totalE=totalExp(), totalI=totalInc(), bal=balance();
    const allExpKeys=Object.keys(S.expenses).sort();
    const allIncKeys=Object.keys(S.incomes).sort();
    const allKeys=[...new Set([...allExpKeys,...allIncKeys])].sort();
    const L=[];
    const pad=(s,n,r=false)=>{s=String(s);return r?s.padStart(n):s.padEnd(n);};
    const line=(ch='─',n=38)=>ch.repeat(n);

    // ── ШАПКА ──────────────────────────────────
    L.push(`📊 ${MONTHS[S.month].toUpperCase()} ${S.year} — ФИНАНСОВЫЙ ОТЧЁТ`);
    L.push(line());
    L.push(`${pad('Доходы',18)} ${pad(fmt(totalI)+' тг',18,true)}`);
    L.push(`${pad('Расходы',18)} ${pad(fmt(totalE)+' тг',18,true)}`);
    L.push(line('─',36));
    const balSign=bal>=0?'+':'';
    L.push(`${pad('Баланс',18)} ${pad(balSign+fmt(bal)+' тг',18,true)} ${bal>=0?'✅':'❌'}`);
    if(totalI>0){
      L.push(`${pad('% расходов',18)} ${pad(Math.round(totalE/totalI*100)+'%',18,true)}`);
      L.push(`${pad('% сбережений',18)} ${pad(Math.round(Math.max(0,bal)/totalI*100)+'%',18,true)}`);
    }
    L.push('');

    // ── СРАВНЕНИЕ С ПРОШЛЫМ МЕСЯЦЕМ ────────────
    let prevM=S.month-1, prevY=S.year;
    if(prevM<0){prevM=11;prevY--;}
    const prevKey=`${prevY}-${prevM}`;
    const prevE=(S.expenses[prevKey]||[]).reduce((s,x)=>s+x.amt,0);
    const prevI=(S.incomes[prevKey]||[]).reduce((s,x)=>s+x.amt,0);
    const prevTot=(S.expenses[prevKey]||[]).reduce((acc,x)=>{acc[x.cat]=(acc[x.cat]||0)+x.amt;return acc;},{});

    if(prevE>0||prevI>0){
      L.push(`📅 СРАВНЕНИЕ: ${MONTHS[prevM].slice(0,3).toUpperCase()} → ${MONTHS[S.month].slice(0,3).toUpperCase()}`);
      L.push(line());
      L.push(`${pad('',12)}${pad(MONTHS[prevM].slice(0,3),10)}${pad(MONTHS[S.month].slice(0,3),10)}${pad('Δ',8,true)}`);
      L.push(line('─',40));
      if(prevI>0||totalI>0){
        const dI=totalI-prevI; const sign=dI>=0?'+':'';
        L.push(`${pad('Доходы',12)}${pad(fmt(prevI),10)}${pad(fmt(totalI),10)}${pad(sign+fmt(dI),8,true)}`);
      }
      const dE=totalE-prevE; const sE=dE>=0?'+':'';
      L.push(`${pad('Расходы',12)}${pad(fmt(prevE),10)}${pad(fmt(totalE),10)}${pad(sE+fmt(dE),8,true)}`);

      // Top changed categories
      const changed=S.expCats.filter(c=>tot[c.id]||prevTot[c.id])
        .map(c=>({...c,diff:(tot[c.id]||0)-(prevTot[c.id]||0)}))
        .filter(c=>Math.abs(c.diff)>500)
        .sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff)).slice(0,4);
      if(changed.length){
        L.push('');
        L.push('Изменения по категориям:');
        changed.forEach(c=>{
          const s=c.diff>=0?'▲':'▼';
          L.push(`  ${s} ${c.e} ${c.n}: ${c.diff>=0?'+':''}${fmt(c.diff)} тг`);
        });
      }
      L.push('');
    }

    // ── СТРУКТУРА РАСХОДОВ (ТАБЛИЦА) ────────────
    if(totalE>0){
      L.push('💸 РАСХОДЫ ПО КАТЕГОРИЯМ');
      L.push(line());
      L.push(`${pad('Категория',20)}${pad('Сумма',10,true)}${pad('%',5,true)}`);
      L.push(line('─',35));
      S.expCats.filter(c=>tot[c.id]).sort((a,b)=>tot[b.id]-tot[a.id]).forEach(c=>{
        const pct=Math.round(tot[c.id]/totalE*100);
        const bar='█'.repeat(Math.round(pct/5));
        L.push(`${pad(c.e+' '+c.n,20)}${pad(fmt(tot[c.id]),10,true)}${pad(pct+'%',5,true)}`);
      });
      L.push(line('─',35));
      L.push(`${pad('ИТОГО',20)}${pad(fmt(totalE),10,true)}${pad('100%',5,true)}`);
      L.push('');
    }

    // ── КРЕДИТЫ ─────────────────────────────────
    const creditAmt=tot.credit||0;
    if(creditAmt>0||S.creditDebt>0){
      L.push('💳 АНАЛИЗ КРЕДИТОВ');
      L.push(line());
      L.push(`${pad('Платёж/мес',22)} ${pad(fmt(creditAmt)+' тг',14,true)}`);
      if(totalI>0) L.push(`${pad('% от дохода',22)} ${pad(Math.round(creditAmt/totalI*100)+'%',14,true)} ${creditAmt/totalI>0.3?'⚠️ > 30%':'✅ норма'}`);
      if(S.creditDebt>0&&creditAmt>0){
        const months=Math.ceil(S.creditDebt/creditAmt);
        const payoffDate=new Date();payoffDate.setMonth(payoffDate.getMonth()+months);
        L.push(`${pad('Общий долг',22)} ${pad(fmt(S.creditDebt)+' тг',14,true)}`);
        L.push(`${pad('Закроется через',22)} ${pad(months+' мес.',14,true)}`);
        L.push(`${pad('Дата погашения',22)} ${pad(MONTHS[payoffDate.getMonth()]+' '+payoffDate.getFullYear(),14,true)} 🏁`);
        if(bal>creditAmt){
          const extra=Math.round(bal*0.3);
          const monthsFaster=Math.ceil(S.creditDebt/(creditAmt+extra));
          L.push(`${pad('Доплачивая +'+fmt(extra),22)} ${pad('закроешь за '+monthsFaster+' мес.',14,true)}`);
        }
      } else if(S.creditDebt===0) {
        L.push('  💡 Укажи общий долг выше — посчитаю дату погашения');
      }
      L.push('');
    }

    // ── НОРМА СБЕРЕЖЕНИЙ ────────────────────────
    if(totalI>0){
      const sp=Math.max(0,bal);
      const spPct=Math.round(sp/totalI*100);
      L.push('💰 НОРМА СБЕРЕЖЕНИЙ (правило 50/30/20)');
      L.push(line());
      L.push(`${pad('Статья',18)}${pad('Норма',8,true)}${pad('Факт',10,true)}${pad('Цель',10,true)}`);
      L.push(line('─',46));
      L.push(`${pad('Нужды (50%)',18)}${pad('50%',8,true)}${pad(totalI>0?Math.round(totalE/totalI*100)+'%':'—',10,true)}${pad(fmt(Math.round(totalI*0.5)),10,true)}`);
      L.push(`${pad('Желания (30%)',18)}${pad('30%',8,true)}${pad('—',10,true)}${pad(fmt(Math.round(totalI*0.3)),10,true)}`);
      L.push(`${pad('Сбережения (20%)',18)}${pad('20%',8,true)}${pad(spPct+'%',10,true)}${pad(fmt(Math.round(totalI*0.2)),10,true)}`);
      L.push('');
      if(spPct>=20) L.push('✅ Отлично — норма сбережений выполнена!');
      else L.push(`⚠️ Сейчас ${fmt(sp)} тг — нужно ${fmt(Math.round(totalI*0.2))} тг (${Math.round(totalI*0.2)-sp>0?'+'+fmt(Math.round(totalI*0.2)-sp)+' тг':''})`);
      L.push('');
    }

    // ── ЦЕЛЬ НАКОПЛЕНИЯ ─────────────────────────
    if(S.goal.amount>0&&S.goal.name){
      const monthlySave=Math.max(0,bal);
      L.push(`🎯 ЦЕЛЬ: ${S.goal.name.toUpperCase()}`);
      L.push(line());
      L.push(`${pad('Нужно накопить',24)} ${pad(fmt(S.goal.amount)+' тг',12,true)}`);
      L.push(`${pad('Откладываешь сейчас',24)} ${pad(fmt(monthlySave)+' тг/мес',12,true)}`);
      if(monthlySave>0){
        const months=Math.ceil(S.goal.amount/monthlySave);
        const d=new Date();d.setMonth(d.getMonth()+months);
        L.push(`${pad('Накопишь за',24)} ${pad(months+' мес.',12,true)}`);
        L.push(`${pad('Примерно к',24)} ${pad(MONTHS[d.getMonth()]+' '+d.getFullYear(),12,true)} 🏁`);
        L.push('');
        L.push('Сценарии ускорения:');
        [10,20,30].forEach(pct=>{
          const extra=Math.round(totalE*(pct/100));
          const m=Math.ceil(S.goal.amount/(monthlySave+extra));
          L.push(`  −${pct}% расходов (+${fmt(extra)} тг/мес) → за ${m} мес.`);
        });
      } else {
        L.push('  ❌ Сначала выйди в плюс по балансу');
      }
      L.push('');
    }

    // ── ТРЕНД ───────────────────────────────────
    if(allKeys.length>=2){
      L.push('📈 ТРЕНД (последние 6 месяцев)');
      L.push(line());
      L.push(`${pad('Месяц',8)}${pad('Доход',10,true)}${pad('Расход',10,true)}${pad('Баланс',10,true)}`);
      L.push(line('─',38));
      allKeys.slice(-6).forEach(k=>{
        const[y,m]=k.split('-');
        const e=(S.expenses[k]||[]).reduce((s,x)=>s+x.amt,0);
        const i=(S.incomes[k]||[]).reduce((s,x)=>s+x.amt,0);
        const b=i-e;
        const bSign=b>=0?'+':'';
        L.push(`${pad(MONTHS[+m].slice(0,3),8)}${pad(i>=1000?Math.round(i/1000)+'k':'—',10,true)}${pad(e>=1000?Math.round(e/1000)+'k':'—',10,true)}${pad(bSign+(Math.abs(b)>=1000?Math.round(b/1000)+'k':b),10,true)}`);
      });
      L.push('');
    }

    // ── РЕКОМЕНДАЦИИ ────────────────────────────
    L.push('💡 РЕКОМЕНДАЦИИ');
    L.push(line());
    let n=1;
    if(bal<0) L.push(`${n++}. ❌ Расходы выше доходов на ${fmt(Math.abs(bal))} тг — срочная оптимизация!`);
    if(totalI>0&&Math.max(0,bal)/totalI<0.1&&bal>=0) L.push(`${n++}. Откладывай минимум ${fmt(Math.round(totalI*0.1))} тг/мес (10% от дохода).`);
    if(tot.credit&&totalI>0&&tot.credit/totalI>0.3) L.push(`${n++}. Кредитная нагрузка ${Math.round(tot.credit/totalI*100)}% — рассмотри рефинансирование.`);
    if(tot.cafe&&totalE>0&&tot.cafe/totalE>0.1) L.push(`${n++}. Кафе ${Math.round(tot.cafe/totalE*100)}% расходов — готовка дома сэкономит ~${fmt(Math.round(tot.cafe*0.4))} тг.`);
    if(totalI>0) L.push(`${n++}. Цель: ${fmt(Math.round(totalI*0.2))} тг/мес в сбережения (20% от дохода).`);
    const sortedCats=S.expCats.filter(c=>tot[c.id]).sort((a,b)=>tot[b.id]-tot[a.id]);
    if(sortedCats[0]&&totalE>0) L.push(`${n++}. Топ расход: ${sortedCats[0].e} ${sortedCats[0].n} (${fmt(tot[sortedCats[0].id])} тг). −10% = экономия ${fmt(Math.round(tot[sortedCats[0].id]*0.1))} тг.`);

    setState({analysis:L.join('\n'),loading:false});
  },400);
}

function PieChart(data,total){
  if(!total)return'<div class="empty">Нет данных</div>';
  const cats=data.sort((a,b)=>b.v-a.v);let angle=-Math.PI/2;const r=65,cx=85,cy=85;let paths='';
  cats.forEach(c=>{const pct=c.v/total,sweep=pct*2*Math.PI;const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);const x2=cx+r*Math.cos(angle+sweep),y2=cy+r*Math.sin(angle+sweep);paths+=`<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${sweep>Math.PI?1:0} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${c.c}"/>`;angle+=sweep;});
  const legend=cats.map(c=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:#94a3b8"><span><span style="color:${c.c}">●</span> ${c.e} ${c.n}</span><span style="color:${c.c}">${Math.round(c.v/total*100)}%</span></div>`).join('');
  return`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 170 170" width="150" height="150" style="flex-shrink:0">${paths}<circle cx="${cx}" cy="${cy}" r="30" fill="#1a1f2e"/></svg><div style="flex:1;min-width:140px">${legend}</div></div>`;
}
function BarChart(barData,color='#fbbf24'){
  const max=Math.max(...barData.map(d=>d.v),1);const W=320,H=100,pad=28,bW=28,gap=(W-pad*2-bW*6)/5;let bars='',labels='',vals='';
  barData.forEach((d,i)=>{const x=pad+i*(bW+gap),bH=d.v?(d.v/max)*(H-15):2,y=H-bH;bars+=`<rect x="${x}" y="${y}" width="${bW}" height="${bH}" rx="3" fill="${color}"/>`;labels+=`<text x="${x+bW/2}" y="${H+13}" text-anchor="middle" fill="#64748b" font-size="10">${d.n}</text>`;if(d.v)vals+=`<text x="${x+bW/2}" y="${y-3}" text-anchor="middle" fill="#94a3b8" font-size="9">${d.v>=1000?Math.round(d.v/1000)+'k':d.v}</text>`;});
  return`<svg viewBox="0 0 ${W} ${H+16}" width="100%" style="display:block">${bars}${labels}${vals}</svg>`;
}

function GroupedBarChart(incData, expData) {
  const W=340, H=130, pad=20, monthW=46, bW=18, gap=2;
  const allVals=[...incData.map(d=>d.v),...expData.map(d=>d.v)];
  const max=Math.max(...allVals,1);
  let bars='',labels='',vals='';
  incData.forEach((inc,i)=>{
    const exp=expData[i];
    const x=pad+i*monthW;
    // Income bar (left)
    const iH=inc.v?(inc.v/max)*(H-25):2, iy=H-iH;
    bars+=`<rect x="${x}" y="${iy}" width="${bW}" height="${iH}" rx="2" fill="#4ade80"/>`;
    if(inc.v) vals+=`<text x="${x+bW/2}" y="${iy-3}" text-anchor="middle" fill="#4ade80" font-size="8">${inc.v>=1000?Math.round(inc.v/1000)+'k':inc.v}</text>`;
    // Expense bar (right)
    const ex=pad+i*monthW+bW+gap;
    const eH=exp.v?(exp.v/max)*(H-25):2, ey=H-eH;
    bars+=`<rect x="${ex}" y="${ey}" width="${bW}" height="${eH}" rx="2" fill="#f87171"/>`;
    if(exp.v) vals+=`<text x="${ex+bW/2}" y="${ey-3}" text-anchor="middle" fill="#f87171" font-size="8">${exp.v>=1000?Math.round(exp.v/1000)+'k':exp.v}</text>`;
    // Month label
    labels+=`<text x="${x+bW}" y="${H+12}" text-anchor="middle" fill="#64748b" font-size="10">${inc.n}</text>`;
    // Balance line
    const bal=inc.v-exp.v;
    const balColor=bal>=0?'#4ade80':'#f87171';
    const balTxt=(bal>=0?'+':'')+( Math.abs(bal)>=1000?Math.round(bal/1000)+'k':bal );
    labels+=`<text x="${x+bW}" y="${H+23}" text-anchor="middle" fill="${balColor}" font-size="8" font-weight="bold">${balTxt}</text>`;
  });
  // Baseline
  const baseline=`<line x1="${pad}" y1="${H}" x2="${W-pad}" y2="${H}" stroke="#1e2a3a" stroke-width="1"/>`;
  return`<svg viewBox="0 0 ${W} ${H+28}" width="100%" style="display:block">${baseline}${bars}${vals}${labels}</svg>`;
}

  const q=(S.search||'').trim().toLowerCase();
  if(!q){
    return`<div class="card"><input class="inp" id="searchInp" placeholder="Поиск по заметке, категории, сумме..." value="${S.search}"/></div><div class="empty">Начни вводить, чтобы найти операцию за любой месяц и год</div>`;
  }
  const results=[];
  Object.entries(S.expenses).forEach(([mkey,list])=>list.forEach(item=>{
    const c=getExpCat(item.cat);
    const hay=`${item.note||''} ${c.n} ${item.amt}`.toLowerCase();
    if(hay.includes(q)) results.push({...item,_type:'exp',_mk:mkey,_cat:c});
  }));
  Object.entries(S.incomes).forEach(([mkey,list])=>list.forEach(item=>{
    const c=getIncCat(item.cat);
    const hay=`${item.note||''} ${c.n} ${item.amt}`.toLowerCase();
    if(hay.includes(q)) results.push({...item,_type:'inc',_mk:mkey,_cat:c});
  }));
  results.sort((a,b)=>new Date(b.date)-new Date(a.date));

  return`
  <div class="card" style="margin-bottom:14px">
    <input class="inp" id="searchInp" placeholder="Поиск по заметке, категории, сумме..." value="${S.search}"/>
  </div>
  <span class="lbl" style="margin-bottom:10px;display:block">НАЙДЕНО: ${results.length}</span>
  ${results.length===0?`<div class="empty">Ничего не найдено</div>`:
    results.slice(0,150).map(item=>{
      const c=item._cat;
      const[y,m]=item._mk.split('-');
      return`<div class="entry-wrap">
        <div class="swipe-del-action" data-del-fid="${item.fid}" data-del-type="${item._type}">🗑️</div>
        <div class="entry search-result" data-jump-month="${m}" data-jump-year="${y}" data-jump-tab="${item._type==='exp'?'expenses':'incomes'}">
          <div style="display:flex;align-items:center;gap:10px;flex:1">
            <div class="dot" style="background:${c.c}"></div>
            <div>
              <div style="font-size:12px;color:#64748b">${c.e} ${c.n} <span style="color:#334155">· ${MONTHS[+m].slice(0,3)} ${y}</span></div>
              ${item.note?`<div style="font-size:12px;color:#94a3b8">${item.note}</div>`:''}
            </div>
          </div>
          <span style="font-weight:700;color:${item._type==='exp'?c.c:'#4ade80'};font-size:14px">${item._type==='exp'?'':'+'}${fmt(item.amt)} тг</span>
        </div>
      </div>`;
    }).join('')}`;
}

  if(dropZone){dropZone.onclick=()=>fileInp.click();dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('over');};dropZone.ondragleave=()=>dropZone.classList.remove('over');dropZone.ondrop=e=>{e.preventDefault();dropZone.classList.remove('over');handleFile(e.dataTransfer.files[0]);};fileInp.onchange=e=>handleFile(e.target.files[0]);}
  document.querySelectorAll('.csv-map').forEach(sel=>sel.onchange=e=>setState({csv:{...S.csv,map:{...S.csv.map,[sel.dataset.field]:e.target.value}}}));
  const csvBack=document.getElementById('csvBack');if(csvBack)csvBack.onclick=()=>setState({csv:{...S.csv,step:S.csv.headers.length?'mapping':'idle'}});
  const csvPreviewBtn=document.getElementById('csvPreviewBtn');if(csvPreviewBtn)csvPreviewBtn.onclick=()=>{if(S.csv.map.amt)buildPreview();};
  const csvImportBtn=document.getElementById('csvImportBtn');if(csvImportBtn)csvImportBtn.onclick=importCSV;

  // ENTRY EDIT EVENTS
  document.querySelectorAll('.entry-tap').forEach(el=>{
    el.onclick=function(e){
      if(e.target.classList.contains('del-btn')||e.target.closest('.del-btn')) return;
      if(el.dataset.swiped==='1'){el.dataset.swiped='0';return;}
      setState({editEntry:{fid:el.dataset.openEdit,type:el.dataset.openType,cat:el.dataset.openCat,amt:Number(el.dataset.openAmt),note:el.dataset.openNote||'',walletId:el.dataset.openWallet||'cash'}});
    };
  });
  document.querySelectorAll('[data-cancel-entry]').forEach(b=>b.onclick=e=>{e.stopPropagation();setState({editEntry:null});});
  document.querySelectorAll('[data-save-entry]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const fid=b.dataset.saveEntry, type=b.dataset.saveType;
    const cat=document.querySelector(`.edit-cat-sel[data-fid="${fid}"]`)?.value||S.editEntry.cat;
    const walletId=document.querySelector(`.edit-wallet-sel[data-fid="${fid}"]`)?.value||S.editEntry.walletId;
    const amt=Number(document.querySelector(`.edit-amt-inp[data-fid="${fid}"]`)?.value||S.editEntry.amt);
    const note=document.querySelector(`.edit-note-inp[data-fid="${fid}"]`)?.value??S.editEntry.note;
    if(amt>0) updateEntry(type,fid,{cat,amt,note,walletId});
  });
  document.querySelectorAll('.edit-cat-sel').forEach(sel=>sel.onchange=e=>{e.stopPropagation();setState({editEntry:{...S.editEntry,cat:e.target.value}});});
  document.querySelectorAll('.edit-wallet-sel').forEach(sel=>sel.onchange=e=>{e.stopPropagation();setState({editEntry:{...S.editEntry,walletId:e.target.value}});});

  // CATEGORY FILTER (click a category card to filter records list)
  document.querySelectorAll('.cat-filter-card').forEach(el=>el.onclick=()=>{
    const cat=el.dataset.catFilter;
    setState({catFilter:S.catFilter===cat?null:cat});
  });
  const clearCatFilter=document.getElementById('clearCatFilter');
  if(clearCatFilter) clearCatFilter.onclick=()=>setState({catFilter:null});

  // SEARCH
  const searchInp=document.getElementById('searchInp');
  if(searchInp) searchInp.oninput=e=>setState({search:e.target.value});
  document.querySelectorAll('.search-result').forEach(el=>{
    el.onclick=()=>{
      if(el.dataset.swiped==='1'){el.dataset.swiped='0';return;}
      setState({month:+el.dataset.jumpMonth,year:+el.dataset.jumpYear,tab:el.dataset.jumpTab,search:''});
    };
  });

  // SWIPE-TO-DELETE
  document.querySelectorAll('.entry-wrap').forEach(wrap=>{
    const inner=wrap.querySelector('.entry');
    if(!inner) return;
    let startX=0,dx=0,dragging=false;
    inner.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;dx=0;dragging=true;inner.style.transition='none';},{passive:true});
    inner.addEventListener('touchmove',e=>{
      if(!dragging)return;
      dx=e.touches[0].clientX-startX;
      if(dx>0)dx=0; if(dx<-80)dx=-80;
      inner.style.transform=`translateX(${dx}px)`;
    },{passive:true});
    inner.addEventListener('touchend',()=>{
      dragging=false;
      inner.style.transition='transform .2s';
      if(dx<-50){inner.style.transform='translateX(-74px)';inner.dataset.swiped='1';}
      else{inner.style.transform='translateX(0)';inner.dataset.swiped='0';}
    });
  });
  document.querySelectorAll('.swipe-del-action').forEach(btn=>btn.onclick=()=>{
    const type=btn.dataset.delType, fid=btn.dataset.delFid;
    if(type==='exp') delExpense(fid);
    else if(type==='inc') delIncome(fid);
  });

  // WALLETS TAB EVENTS
  document.querySelectorAll('.rate-inp').forEach(inp=>inp.onchange=e=>{
    const rates={...S.exchangeRates,[inp.dataset.currency]:Number(e.target.value)||0};
    localStorage.setItem('findir_rates',JSON.stringify(rates));
    setState({exchangeRates:rates});
  });
  const addTransferBtn=document.getElementById('addTransferBtn');
  if(addTransferBtn){
    addTransferBtn.onclick=()=>{
      setState({transferForm:{
        from:document.getElementById('trFrom').value,
        to:document.getElementById('trTo').value,
        amtFrom:document.getElementById('trAmtFrom').value,
        amtTo:document.getElementById('trAmtTo').value,
        note:document.getElementById('trNote').value,
        date:document.getElementById('trDate').value,
      }});
      setTimeout(addTransfer,0);
    };
    document.getElementById('trFrom').onchange=e=>setState({transferForm:{...S.transferForm,from:e.target.value}});
    document.getElementById('trTo').onchange=e=>setState({transferForm:{...S.transferForm,to:e.target.value}});
  }
  document.querySelectorAll('[data-del-transfer]').forEach(b=>b.onclick=()=>delTransfer(b.dataset.delTransfer));

  const addWalletBtn=document.getElementById('addWalletBtn');
  if(addWalletBtn){
    addWalletBtn.onclick=()=>{
      const e=document.getElementById('nw-emoji')?.value||'💰';
      const n=document.getElementById('nw-name')?.value||'';
      const currency=document.getElementById('nw-currency')?.value||'KZT';
      setState({walletSettings:{...S.walletSettings,newWallet:{...S.walletSettings.newWallet,e,n,currency}}});
      setTimeout(addWallet,0);
    };
    const nwName=document.getElementById('nw-name');
    if(nwName)nwName.onkeydown=e=>{if(e.key==='Enter')addWalletBtn.click();};
    const nwEmoji=document.getElementById('nw-emoji');
    if(nwEmoji)nwEmoji.oninput=e=>setState({walletSettings:{...S.walletSettings,newWallet:{...S.walletSettings.newWallet,e:e.target.value}}});
  }
  document.querySelectorAll('.color-pick-wal').forEach(b=>b.onclick=()=>{setState({walletSettings:{...S.walletSettings,newWallet:{...S.walletSettings.newWallet,c:b.dataset.color}}});});
  document.querySelectorAll('.color-pick-wal-edit').forEach(b=>b.onclick=()=>{if(S.walletSettings.editWallet)setState({walletSettings:{...S.walletSettings,editWallet:{...S.walletSettings.editWallet,c:b.dataset.color}}});});
  document.querySelectorAll('[data-edit-wal]').forEach(b=>b.onclick=()=>{
    const wal=S.wallets.find(w=>w.id===b.dataset.editWal);
    if(wal)setState({walletSettings:{...S.walletSettings,editId:wal.id,editWallet:{...wal}}});
  });
  document.querySelectorAll('[data-del-wal]').forEach(b=>b.onclick=()=>{
    const wal=S.wallets.find(w=>w.id===b.dataset.delWal);
    if(wal) deleteWallet(wal);
  });
  document.querySelectorAll('[data-cancel-wal-edit]').forEach(b=>b.onclick=()=>setState({walletSettings:{...S.walletSettings,editId:null,editWallet:null}}));
  document.querySelectorAll('[data-save-wal-edit]').forEach(b=>b.onclick=()=>{
    if(!S.walletSettings.editWallet)return;
    const e=document.getElementById('ew-emoji')?.value||S.walletSettings.editWallet.e;
    const n=document.getElementById('ew-name')?.value||S.walletSettings.editWallet.n;
    const currency=document.getElementById('ew-currency')?.value||S.walletSettings.editWallet.currency;
    updateWallet({...S.walletSettings.editWallet,e,n,currency});
  });

  // SETTINGS EVENTS
  document.querySelectorAll('[data-set-type]').forEach(b=>b.onclick=()=>setState({settings:{...S.settings,activeType:b.dataset.setType,editId:null,editCat:null,newCat:{...S.settings.newCat,type:b.dataset.setType}}}));
  const resetCatsBtn=document.getElementById('resetCatsBtn');
  if(resetCatsBtn) resetCatsBtn.onclick=()=>resetCategoriesToDefault(S.settings.activeType);

  // Color pickers (new)
  document.querySelectorAll('.color-pick').forEach(b=>b.onclick=()=>{setState({settings:{...S.settings,newCat:{...S.settings.newCat,c:b.dataset.color}}});});

  // Color pickers (edit)
  document.querySelectorAll('.color-pick-edit').forEach(b=>b.onclick=()=>{if(S.settings.editCat)setState({settings:{...S.settings,editCat:{...S.settings.editCat,c:b.dataset.color}}});});

  // Add cat btn
  const addCatBtn=document.getElementById('addCatBtn');
  if(addCatBtn){
    addCatBtn.onclick=()=>{
      const e=document.getElementById('nc-emoji')?.value||'💼';
      const n=document.getElementById('nc-name')?.value||'';
      setState({settings:{...S.settings,newCat:{...S.settings.newCat,e,n}}});
      setTimeout(addCategory,0);
    };
    const ncName=document.getElementById('nc-name');
    if(ncName)ncName.onkeydown=e=>{if(e.key==='Enter')addCatBtn.click();};
    const ncEmoji=document.getElementById('nc-emoji');
    if(ncEmoji)ncEmoji.oninput=e=>setState({settings:{...S.settings,newCat:{...S.settings.newCat,e:e.target.value}}});
  }

  // Edit cat btns
  document.querySelectorAll('[data-edit-cat]').forEach(b=>b.onclick=()=>{
    const type=b.dataset.catType;
    const cats=type==='expense'?S.expCats:S.incCats;
    const cat=cats.find(c=>c.id===b.dataset.editCat);
    if(cat)setState({settings:{...S.settings,editId:cat.id,editCat:{...cat}}});
  });

  // Delete cat btns
  document.querySelectorAll('[data-del-cat]').forEach(b=>b.onclick=()=>{
    const type=b.dataset.catType;
    const cats=type==='expense'?S.expCats:S.incCats;
    const cat=cats.find(c=>c.id===b.dataset.delCat);
    if(cat) deleteCategory({...cat,type:type==='expense'?'expense':'income'});
  });

  // Cancel edit
  document.querySelectorAll('[data-cancel-edit]').forEach(b=>b.onclick=()=>setState({settings:{...S.settings,editId:null,editCat:null}}));

  // Save edit
  document.querySelectorAll('[data-save-edit]').forEach(b=>b.onclick=()=>{
    if(!S.settings.editCat)return;
    const e=document.getElementById('ec-emoji')?.value||S.settings.editCat.e;
    const n=document.getElementById('ec-name')?.value||S.settings.editCat.n;
    updateCategory({...S.settings.editCat,e,n});
  });
}

render();
await loadAll();
await initDefaultCategories();
await initDefaultWallets();
</script>
</body>
</html>
