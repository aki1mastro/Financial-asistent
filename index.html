const fmt = n => new Intl.NumberFormat('ru-RU').format(Math.round(n));

function guessCat(cat, note, cats) {
  const t = ((cat||'')+' '+(note||'')).toLowerCase();
  for (const c of cats) { if ((c.k||[]).some(k=>t.includes(k))) return c.id; }
  return cats[cats.length-1]?.id || 'other';
}
function parseDate(s) {
  if (!s) return new Date(); s=s.trim();
  let m;
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(s); return isNaN(d)?new Date():d;
}
function detectBank(text){const fl=text.split('\n').find(l=>!l.startsWith('sep=')&&l.trim());return fl&&/^(Расход|Expense)/i.test(fl);}
function parseBankCSV(text, expCats){
  const lines=text.replace(/\r\n/g,'\n').split('\n').filter(l=>!l.startsWith('sep=')&&l.trim());
  const merged=[];
  for(const line of lines){if(/^(Расход|Expense)/i.test(line)||!merged.length)merged.push(line);else merged[merged.length-1]+=' '+line.trim();}
  const rows=[];
  for(const line of merged){
    const p=line.split(',');if(p.length<5)continue;
    const type=p[0].trim(),dt=p[1].trim(),cat=p[2].trim();
    const amt=parseFloat((p[p.length-2]||'').trim().replace(/\s/g,''));
    const desc=p.slice(3,p.length-2).join(',').trim();
    if(!/^(Расход|Expense)/i.test(type)||!amt||amt<=0)continue;
    const d=parseDate(dt);
    rows.push({cat:guessCat(cat,desc,expCats),amt,note:[cat,desc].filter(Boolean).join(' — ').slice(0,80),date:d.toISOString(),monthKey:`${d.getFullYear()}-${d.getMonth()}`});
  }
  return rows;
}
function parseCSV(text){
  const lines=text.replace(/\r\n/g,'\n').split('\n');
  const headers=lines[0].split(',').map(h=>h.trim());
  const rows=[];
  for(let i=1;i<lines.length;i++){if(!lines[i].trim())continue;const vals=lines[i].split(',');const obj={};headers.forEach((h,j)=>{obj[h]=(vals[j]||'').trim();});rows.push(obj);}
  return{headers,rows};
}

function setState(p){Object.assign(S,typeof p==='function'?p(S):p);render();}
function getExpCat(id){
  return S.expCats.find(c=>c.id===id)
    || (S.ghostCats[id] ? {...S.ghostCats[id], deleted:true} : null)
    || S.expCats.find(c=>c.id==='other')
    || {e:'💼',n:'Прочее',c:'#64748b',id:'other'};
}
function getIncCat(id){
  return S.incCats.find(c=>c.id===id)
    || (S.ghostCats[id] ? {...S.ghostCats[id], deleted:true} : null)
    || S.incCats.find(c=>c.id==='other_i')
    || {e:'💰',n:'Прочее',c:'#64748b',id:'other_i'};
}
function mk(){return `${S.year}-${S.month}`;}
function expData(){return S.expenses[mk()]||[];}
function incData(){return S.incomes[mk()]||[];}
function expTotals(){const t={};for(const x of expData())t[x.cat]=(t[x.cat]||0)+x.amt;return t;}
function totalExp(){return Object.values(expTotals()).reduce((a,b)=>a+b,0);}
function totalInc(){return (S.incomes[mk()]||[]).reduce((s,x)=>s+x.amt,0);}
function balance(){return totalInc()-totalExp();}

async function loadAll(){
  try{
    const [eSnap,iSnap,cSnap]=await Promise.all([
      getDocs(collection(db,'expenses')),
      getDocs(collection(db,'incomes')),
      getDocs(collection(db,'categories')),
    ]);
    const expenses={},incomes={};
    eSnap.forEach(d=>{const x={...d.data(),fid:d.id};if(!expenses[x.monthKey])expenses[x.monthKey]=[];expenses[x.monthKey].push(x);});
    iSnap.forEach(d=>{const x={...d.data(),fid:d.id};if(!incomes[x.monthKey])incomes[x.monthKey]=[];incomes[x.monthKey].push(x);});

    // Load custom categories
    const expCats=[],incCats=[];
    cSnap.forEach(d=>{const x={...d.data(),fid:d.id};if(x.type==='expense')expCats.push(x);else incCats.push(x);});
    S.expenses=expenses; S.incomes=incomes;
    if(expCats.length>0) S.expCats=expCats.sort((a,b)=>(a.order||0)-(b.order||0));
    if(incCats.length>0) S.incCats=incCats.sort((a,b)=>(a.order||0)-(b.order||0));
    render();
  }catch(e){alert('Ошибка Firebase: '+e.message);}
}

// Categories CRUD
async function saveCategoryToFirebase(catData){
  setState({syncing:true});
  const data={...catData,k:catData.k||[]};
  if(catData.fid){
    await updateDoc(doc(db,'categories',catData.fid),data);
  } else {
    const ref=await addDoc(collection(db,'categories'),data);
    catData.fid=ref.id;
  }
  setState({syncing:false});
  return catData;
}

async function addCategory(){
  const nc=S.settings.newCat;
  if(!nc.n.trim()) return;
  const newCat={id:'cat_'+Date.now(),e:nc.e,n:nc.n.trim(),c:nc.c,type:nc.type,k:[],order:Date.now()};
  setState({syncing:true});
  const ref=await addDoc(collection(db,'categories'),newCat);
  newCat.fid=ref.id;
  if(nc.type==='expense') S.expCats=[...S.expCats,newCat];
  else S.incCats=[...S.incCats,newCat];
  setState({syncing:false,settings:{...S.settings,newCat:{e:'💼',n:'',c:'#4ade80',type:nc.type}}});
}

async function updateCategory(catData){
  setState({syncing:true});
  if(catData.fid){
    await updateDoc(doc(db,'categories',catData.fid),catData);
  } else {
    // Was a default cat - save to firebase
    const ref=await addDoc(collection(db,'categories'),catData);
    catData.fid=ref.id;
  }
  if(catData.type==='expense') S.expCats=S.expCats.map(c=>c.id===catData.id?catData:c);
  else S.incCats=S.incCats.map(c=>c.id===catData.id?catData:c);
  setState({syncing:false,settings:{...S.settings,editId:null,editCat:null}});
}

async function deleteCategory(cat){
  if (!confirm(`Удалить категорию "${cat.n}"?\n\nСтарые записи останутся с этой категорией (будет показано серым).`)) return;
  setState({syncing:true});
  // Save to ghostCats so old records can still display the name
  S.ghostCats = {...S.ghostCats, [cat.id]: {...cat, deleted:true}};
  // Remove from active list
  if (cat.fid) await deleteDoc(doc(db,'categories',cat.fid));
  if (cat.type==='expense') S.expCats = S.expCats.filter(c=>c.id!==cat.id);
  else S.incCats = S.incCats.filter(c=>c.id!==cat.id);
  setState({syncing:false});
}

// Initialize defaults to Firebase if empty
async function initDefaultCategories(){
  const snap=await getDocs(collection(db,'categories'));
  if(snap.empty){
    for(const c of DEFAULT_EXP){const ref=await addDoc(collection(db,'categories'),{...c,type:'expense',order:DEFAULT_EXP.indexOf(c)});c.fid=ref.id;}
    for(const c of DEFAULT_INC){const ref=await addDoc(collection(db,'categories'),{...c,type:'income',order:DEFAULT_INC.indexOf(c)});c.fid=ref.id;}
    S.expCats=[...DEFAULT_EXP];S.incCats=[...DEFAULT_INC];render();
  }
}

async function updateEntry(type, fid, patch){
  setState({syncing:true});
  await updateDoc(doc(db, type==='exp'?'expenses':'incomes', fid), patch);
  if(type==='exp'){
    S.expenses={...S.expenses,[mk()]:S.expenses[mk()].map(e=>e.fid===fid?{...e,...patch}:e)};
  } else {
    S.incomes={...S.incomes,[mk()]:S.incomes[mk()].map(e=>e.fid===fid?{...e,...patch}:e)};
  }
  setState({syncing:false, editEntry:null});
}

function handleFile(file){
  if(!file)return;const reader=new FileReader();
  reader.onload=e=>{
    const text=e.target.result;
    if(detectBank(text)){const rows=parseBankCSV(text,S.expCats);setState({csv:{...S.csv,step:'preview',preview:rows.map(r=>({...r,id:Math.random(),mk:r.monthKey})),info:`Банковский формат — ${rows.length} расходов`}});}
    else{
      const{headers,rows}=parseCSV(text);const lower=headers.map(h=>h.toLowerCase());
      const find=kws=>headers[lower.findIndex(h=>kws.some(k=>h.includes(k)))]||'';
      setState({csv:{...S.csv,step:'mapping',headers,rows,info:`CSV — ${rows.length} строк`,map:{amt:find(['сумм','amount','стоим','цена']),date:find(['дата','date','время']),cat:find(['категор','category','тип']),note:find(['описан','note','заметк','назван','наименован','description','товар'])}}});
    }
  };reader.readAsText(file,'utf-8');
}
function buildPreview(){
  const{rows,map}=S.csv;
  const preview=rows.filter(r=>parseFloat((r[map.amt]||'').replace(/\s/g,'').replace(',','.'))||0).map(r=>{
    const amt=parseFloat((r[map.amt]||'').replace(/\s/g,'').replace(',','.'))||0;
    const rawCat=map.cat?r[map.cat]:'',note=map.note?r[map.note]:'';
    const d=parseDate(map.date?r[map.date]:'');
    return{id:Math.random(),date:d.toISOString(),mk:`${d.getFullYear()}-${d.getMonth()}`,cat:guessCat(rawCat,note,S.expCats),amt,note:[rawCat,note].filter(Boolean).join(' — ').slice(0,80)};
  });
  setState({csv:{...S.csv,step:'preview',preview}});
}
async function importCSV(){
  setState({syncing:true});
  for(const r of S.csv.preview){
    const entry={cat:r.cat,amt:r.amt,note:r.note,date:r.date,monthKey:r.mk};
    const ref=await addDoc(collection(db,'expenses'),entry);entry.fid=ref.id;
    S.expenses={...S.expenses,[r.mk]:[...(S.expenses[r.mk]||[]),entry]};
  }
  setState({csv:{...S.csv,step:'done'},syncing:false});
  setTimeout(()=>setState({csv:{...S.csv,step:'idle'}}),2500);
}

function doAnalysis(){
  setState({loading:true,analysis:'',tab:'analysis'});
  setTimeout(()=>{
    const tot=expTotals(),totalE=totalExp(),totalI=totalInc(),bal=balance();
    const allExpKeys=Object.keys(S.expenses),allIncKeys=Object.keys(S.incomes);
    const L=[];
    L.push(`📊 ФИНАНСОВЫЙ АНАЛИЗ: ${MONTHS[S.month]} ${S.year}`);L.push('');
    L.push(`💵 Доходы:  ${fmt(totalI)} тг`);L.push(`💸 Расходы: ${fmt(totalE)} тг`);
    L.push(`${bal>=0?'✅':'❌'} Баланс:  ${bal>=0?'+':''}${fmt(bal)} тг`);
    if(totalI>0)L.push(`📊 Тратишь ${Math.round(totalE/totalI*100)}% от дохода`);
    L.push('');
    if(totalI>0){
      const sp=Math.round(bal/totalI*100);L.push('💰 НОРМА СБЕРЕЖЕНИЙ');
      if(sp>=20)L.push(`✅ Откладываешь ${sp}% — отлично! Норма от 20%.`);
      else if(sp>=10)L.push(`⚠️ Откладываешь ${sp}% — неплохо, стремись к 20%.`);
      else if(sp>0)L.push(`⚠️ Откладываешь только ${sp}% — сократи расходы.`);
      else L.push(`❌ Расходы превышают доходы на ${fmt(Math.abs(bal))} тг!`);
      L.push('');
    }
    if(totalE>0){
      L.push('🔍 СТРУКТУРА РАСХОДОВ');
      S.expCats.filter(c=>tot[c.id]).sort((a,b)=>tot[b.id]-tot[a.id]).forEach(c=>L.push(`${c.e} ${c.n}: ${fmt(tot[c.id])} тг (${Math.round(tot[c.id]/totalE*100)}%)`));
      L.push('');
    }
    L.push('💡 РЕКОМЕНДАЦИИ');let n=1;
    if(bal<0)L.push(`${n++}. Расходы выше доходов на ${fmt(Math.abs(bal))} тг — найди статью для сокращения.`);
    if(totalI>0&&bal/totalI<0.1&&bal>=0)L.push(`${n++}. Норма сбережений ниже 10%. Правило 50/30/20: нужды/желания/сбережения.`);
    if(tot.credit&&tot.credit/totalE>0.25)L.push(`${n++}. Кредиты — ${Math.round(tot.credit/totalE*100)}% расходов. Рассмотри рефинансирование.`);
    if(tot.cafe&&tot.cafe/totalE>0.1)L.push(`${n++}. Кафе: готовка дома сэкономит ~${fmt(Math.round(tot.cafe*0.4))} тг/мес.`);
    if(totalI>0)L.push(`${n++}. Цель: откладывай минимум ${fmt(Math.round(totalI*0.2))} тг/мес (20% от дохода).`);
    L.push('');
    const allKeys=[...new Set([...allExpKeys,...allIncKeys])].sort();
    if(allKeys.length>=2){
      L.push('📈 ТРЕНД ПО МЕСЯЦАМ');
      allKeys.forEach(k=>{const[y,m]=k.split('-');const e=(S.expenses[k]||[]).reduce((s,x)=>s+x.amt,0);const i=(S.incomes[k]||[]).reduce((s,x)=>s+x.amt,0);const b=i-e;L.push(`${MONTHS[+m].slice(0,3)} ${y}: ↑${fmt(i)} ↓${fmt(e)} = ${b>=0?'+':''}${fmt(b)} тг`);});
      L.push('');
    }
    L.push('🎯 ПЛАН НА СЛЕДУЮЩИЙ МЕСЯЦ');
    const avgE=allExpKeys.length?Math.round(allExpKeys.reduce((s,k)=>s+(S.expenses[k]||[]).reduce((a,x)=>a+x.amt,0),0)/allExpKeys.length):totalE;
    const avgI=allIncKeys.length?Math.round(allIncKeys.reduce((s,k)=>s+(S.incomes[k]||[]).reduce((a,x)=>a+x.amt,0),0)/allIncKeys.length):totalI;
    L.push(`Целевые доходы: ${fmt(avgI)} тг`);L.push(`Целевые расходы: ${fmt(Math.round(avgE*0.9))} тг (−10%)`);L.push(`Сбережения: ${fmt(Math.round(avgI*0.2))} тг (20%)`);
    setState({analysis:L.join('\n'),loading:false});
  },400);
}

function PieChart(data,total){
  if(!total)return'<div class="empty">Нет данных</div>';
  const cats=data.sort((a,b)=>b.v-a.v);let angle=-Math.PI/2;const r=65,cx=85,cy=85;let paths='';
  cats.forEach(c=>{const pct=c.v/total,sweep=pct*2*Math.PI;const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);const x2=cx+r*Math.cos(angle+sweep),y2=cy+r*Math.sin(angle+sweep);paths+=`<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${sweep>Math.PI?1:0} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${c.c}"/>`;angle+=sweep;});
  const legend=cats.map(c=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:#94a3b8"><span><span style="color:${c.c}">●</span> ${c.e} ${c.n}</span><span style="color:${c.c}">${Math.round(c.v/total*100)}%</span></div>`).join('');
  return`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 170 170" width="150" height="150" style="flex-shrink:0">${paths}<circle cx="${cx}" cy="${cy}" r="30" fill="#1a1f2e"/></svg><div style="flex:1;min-width:140px">${legend}</div></div>`;
}
function BarChart(barData,color='#fbbf24'){
  const max=Math.max(...barData.map(d=>d.v),1);const W=320,H=100,pad=28,bW=28,gap=(W-pad*2-bW*6)/5;let bars='',labels='',vals='';
  barData.forEach((d,i)=>{const x=pad+i*(bW+gap),bH=d.v?(d.v/max)*(H-15):2,y=H-bH;bars+=`<rect x="${x}" y="${y}" width="${bW}" height="${bH}" rx="3" fill="${color}"/>`;labels+=`<text x="${x+bW/2}" y="${H+13}" text-anchor="middle" fill="#64748b" font-size="10">${d.n}</text>`;if(d.v)vals+=`<text x="${x+bW/2}" y="${y-3}" text-anchor="middle" fill="#94a3b8" font-size="9">${d.v>=1000?Math.round(d.v/1000)+'k':d.v}</text>`;});
  return`<svg viewBox="0 0 ${W} ${H+16}" width="100%" style="display:block">${bars}${labels}${vals}</svg>`;
}

    ${S.tab==='csv'?`
      ${S.csv.step==='idle'?`<div class="drop" id="dropZone"><div style="font-size:40px;margin-bottom:12px">📂</div><div style="font-size:15px;color:#94a3b8;margin-bottom:8px">Нажми или перетащи CSV</div><div style="font-size:12px;color:#475569">Kaspi, Halyk и другие банки</div><input type="file" id="fileInp" accept=".csv,.txt" style="display:none"/></div><div class="card"><span class="lbl">ФОРМАТЫ</span><div style="font-size:13px;color:#64748b;line-height:1.9">✅ <b style="color:#94a3b8">Kaspi/Halyk</b> без заголовков<br>✅ <b style="color:#94a3b8">Стандартный CSV</b> с заголовками</div></div>`:''}
      ${S.csv.step==='mapping'?`<div class="card"><span class="lbl">НАСТРОЙКА КОЛОНОК</span><div style="font-size:12px;color:#4ade80;margin-bottom:12px;background:#0f2a1a;padding:8px 12px;border-radius:6px">ℹ️ ${S.csv.info}</div><div class="grid2" style="margin-bottom:14px">${[['amt','💰 Сумма *'],['date','📅 Дата'],['cat','🏷 Категория'],['note','📝 Описание']].map(([f,l])=>`<div><div style="font-size:12px;color:#64748b;margin-bottom:6px">${l}</div><select class="inp csv-map" data-field="${f}"><option value="">— не выбрано —</option>${S.csv.headers.map(h=>`<option value="${h}"${S.csv.map[f]===h?' selected':''}>${h}</option>`).join('')}</select></div>`).join('')}</div><div style="display:flex;gap:10px"><button class="btn2" style="flex:1" id="csvBack">← Назад</button><button class="btn" style="flex:2" id="csvPreviewBtn">Предпросмотр →</button></div></div>`:''}
      ${S.csv.step==='preview'?`<div class="card"><span class="lbl">ПРЕДПРОСМОТР</span><div style="font-size:12px;color:#4ade80;margin-bottom:12px;background:#0f2a1a;padding:8px 12px;border-radius:6px">✅ ${S.csv.preview.length} записей · ${fmt(S.csv.preview.reduce((s,r)=>s+r.amt,0))} тг</div><div style="max-height:280px;overflow-y:auto;margin-bottom:14px">${S.csv.preview.slice(0,100).map(r=>{const c=getExpCat(r.cat),d=new Date(r.date);return`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1e2a3a22"><div style="display:flex;gap:8px;align-items:center"><span style="font-size:11px;color:#475569;flex-shrink:0">${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}</span><span style="font-size:11px;color:${c.c}">${c.e} ${c.n}</span>${r.note?`<span style="font-size:11px;color:#64748b">${r.note.slice(0,25)}${r.note.length>25?'…':''}</span>`:''}</div><span style="font-weight:700;color:#fbbf24;font-size:12px;flex-shrink:0">${fmt(r.amt)} тг</span></div>`;}).join('')}</div><div style="display:flex;gap:10px"><button class="btn2" style="flex:1" id="csvBack">← Назад</button><button class="btn" style="flex:2;background:linear-gradient(135deg,#f59e0b,#fbbf24)" id="csvImportBtn">✅ Импортировать</button></div></div>`:''}
      ${S.csv.step==='done'?`<div class="card" style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:12px">✅</div><div style="font-size:16px;color:#4ade80;font-weight:700">Сохранено в Firebase!</div></div>`:''}
    `:''}

    ${S.tab==='analysis'?`
      <button class="btn" id="analyzeBtn" style="width:100%;background:${S.loading?'#1e2a3a':'linear-gradient(135deg,#f59e0b,#fbbf24)'};color:${S.loading?'#64748b':'#0f1117'};border:none;border-radius:10px;padding:16px;font-size:15px;font-weight:700;cursor:${S.loading?'not-allowed':'pointer'};margin-bottom:16px">${S.loading?'⏳ Анализирую...':'🤖 Полный финансовый анализ'}</button>
      ${!S.analysis&&!S.loading?'<div class="empty">Нажми кнопку — получишь полный анализ<br>доходов, расходов и советы по накоплению</div>':''}
      ${S.loading?'<div class="empty">⚙️ Считаю данные...</div>':''}
      ${S.analysis?`<div class="card" style="line-height:1.8">${S.analysis.split('\n').map(line=>{const bold=line.startsWith('📊')||line.startsWith('💰')||line.startsWith('🔍')||line.startsWith('⚡')||line.startsWith('💡')||line.startsWith('📈')||line.startsWith('🎯');return`<p style="margin:0 0 6px 0;font-weight:${bold?700:400};color:${bold?'#f1f5f9':'#94a3b8'};font-size:${bold?15:13}px">${line||'&nbsp;'}</p>`;}).join('')}</div>`:''}
    `:''}

    ${S.tab==='settings'?renderSettings():''}

    </div>
  </div>`;

  // EVENTS
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setState({month:+b.dataset.m}));
  const prevYear=document.getElementById('prevYear');if(prevYear)prevYear.onclick=()=>setState({year:S.year-1});
  const nextYear=document.getElementById('nextYear');if(nextYear)nextYear.onclick=()=>setState({year:S.year+1});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setState({tab:b.dataset.tab}));
  document.querySelectorAll('.del-btn').forEach(b=>b.onclick=()=>{if(b.dataset.type==='exp')delExpense(b.dataset.fid);else delIncome(b.dataset.fid);});

  // Expense form
  const addExpBtn=document.getElementById('addExpBtn');
  if(addExpBtn){
    addExpBtn.onclick=()=>{setState({expForm:{cat:document.getElementById('eCat').value,amt:document.getElementById('eAmt').value,note:document.getElementById('eNote').value}});setTimeout(addExpense,0);};
    document.getElementById('eAmt').onkeydown=e=>{if(e.key==='Enter')addExpBtn.click();};
    document.getElementById('eNote').onkeydown=e=>{if(e.key==='Enter')addExpBtn.click();};
    document.getElementById('eCat').onchange=e=>setState({expForm:{...S.expForm,cat:e.target.value}});
  }

  // Income form
  const addIncBtn=document.getElementById('addIncBtn');
  if(addIncBtn){
    addIncBtn.onclick=()=>{setState({incForm:{cat:document.getElementById('iCat').value,amt:document.getElementById('iAmt').value,note:document.getElementById('iNote').value}});setTimeout(addIncome,0);};
    document.getElementById('iAmt').onkeydown=e=>{if(e.key==='Enter')addIncBtn.click();};
    document.getElementById('iNote').onkeydown=e=>{if(e.key==='Enter')addIncBtn.click();};
    document.getElementById('iCat').onchange=e=>setState({incForm:{...S.incForm,cat:e.target.value}});
  }

  // Analysis
  const analyzeBtn=document.getElementById('analyzeBtn');
  if(analyzeBtn)analyzeBtn.onclick=()=>{if(!S.loading)doAnalysis();};

  // CSV
  const dropZone=document.getElementById('dropZone'),fileInp=document.getElementById('fileInp');
  if(dropZone){dropZone.onclick=()=>fileInp.click();dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('over');};dropZone.ondragleave=()=>dropZone.classList.remove('over');dropZone.ondrop=e=>{e.preventDefault();dropZone.classList.remove('over');handleFile(e.dataTransfer.files[0]);};fileInp.onchange=e=>handleFile(e.target.files[0]);}
  document.querySelectorAll('.csv-map').forEach(sel=>sel.onchange=e=>setState({csv:{...S.csv,map:{...S.csv.map,[sel.dataset.field]:e.target.value}}}));
  const csvBack=document.getElementById('csvBack');if(csvBack)csvBack.onclick=()=>setState({csv:{...S.csv,step:S.csv.headers.length?'mapping':'idle'}});
  const csvPreviewBtn=document.getElementById('csvPreviewBtn');if(csvPreviewBtn)csvPreviewBtn.onclick=()=>{if(S.csv.map.amt)buildPreview();};
  const csvImportBtn=document.getElementById('csvImportBtn');if(csvImportBtn)csvImportBtn.onclick=importCSV;

  // ENTRY EDIT EVENTS
  document.querySelectorAll('.entry-tap').forEach(el=>{
    el.onclick=function(e){
      if(e.target.classList.contains('del-btn')||e.target.closest('.del-btn')) return;
      setState({editEntry:{fid:el.dataset.openEdit,type:el.dataset.openType,cat:el.dataset.openCat,amt:Number(el.dataset.openAmt),note:el.dataset.openNote||''}});
    };
  });
  document.querySelectorAll('[data-cancel-entry]').forEach(b=>b.onclick=e=>{e.stopPropagation();setState({editEntry:null});});
  document.querySelectorAll('[data-save-entry]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const fid=b.dataset.saveEntry, type=b.dataset.saveType;
    const cat=document.querySelector(`.edit-cat-sel[data-fid="${fid}"]`)?.value||S.editEntry.cat;
    const amt=Number(document.querySelector(`.edit-amt-inp[data-fid="${fid}"]`)?.value||S.editEntry.amt);
    const note=document.querySelector(`.edit-note-inp[data-fid="${fid}"]`)?.value??S.editEntry.note;
    if(amt>0) updateEntry(type,fid,{cat,amt,note});
  });
  document.querySelectorAll('.edit-cat-sel').forEach(sel=>sel.onchange=e=>{e.stopPropagation();setState({editEntry:{...S.editEntry,cat:e.target.value}});});

  // SETTINGS EVENTS
  document.querySelectorAll('[data-set-type]').forEach(b=>b.onclick=()=>setState({settings:{...S.settings,activeType:b.dataset.setType,editId:null,editCat:null,newCat:{...S.settings.newCat,type:b.dataset.setType}}}));

  // Color pickers (new)
  document.querySelectorAll('.color-pick').forEach(b=>b.onclick=()=>{setState({settings:{...S.settings,newCat:{...S.settings.newCat,c:b.dataset.color}}});});

  // Color pickers (edit)
  document.querySelectorAll('.color-pick-edit').forEach(b=>b.onclick=()=>{if(S.settings.editCat)setState({settings:{...S.settings,editCat:{...S.settings.editCat,c:b.dataset.color}}});});

  // Add cat btn
  const addCatBtn=document.getElementById('addCatBtn');
  if(addCatBtn){
    addCatBtn.onclick=()=>{
      const e=document.getElementById('nc-emoji')?.value||'💼';
      const n=document.getElementById('nc-name')?.value||'';
      setState({settings:{...S.settings,newCat:{...S.settings.newCat,e,n}}});
      setTimeout(addCategory,0);
    };
    const ncName=document.getElementById('nc-name');
    if(ncName)ncName.onkeydown=e=>{if(e.key==='Enter')addCatBtn.click();};
    const ncEmoji=document.getElementById('nc-emoji');
    if(ncEmoji)ncEmoji.oninput=e=>setState({settings:{...S.settings,newCat:{...S.settings.newCat,e:e.target.value}}});
  }

  // Edit cat btns
  document.querySelectorAll('[data-edit-cat]').forEach(b=>b.onclick=()=>{
    const type=b.dataset.catType;
    const cats=type==='expense'?S.expCats:S.incCats;
    const cat=cats.find(c=>c.id===b.dataset.editCat);
    if(cat)setState({settings:{...S.settings,editId:cat.id,editCat:{...cat}}});
  });

  // Delete cat btns
  document.querySelectorAll('[data-del-cat]').forEach(b=>b.onclick=()=>{
    const type=b.dataset.catType;
    const cats=type==='expense'?S.expCats:S.incCats;
    const cat=cats.find(c=>c.id===b.dataset.delCat);
    if(cat) deleteCategory({...cat,type:type==='expense'?'expense':'income'});
  });

  // Cancel edit
  document.querySelectorAll('[data-cancel-edit]').forEach(b=>b.onclick=()=>setState({settings:{...S.settings,editId:null,editCat:null}}));

  // Save edit
  document.querySelectorAll('[data-save-edit]').forEach(b=>b.onclick=()=>{
    if(!S.settings.editCat)return;
    const e=document.getElementById('ec-emoji')?.value||S.settings.editCat.e;
    const n=document.getElementById('ec-name')?.value||S.settings.editCat.n;
    updateCategory({...S.settings.editCat,e,n});
  });
}

render();
await loadAll();
await initDefaultCategories();
</script>
</body>
</html>
